# Esempio: chiama un numero quando scatta l'allarme (integrazione hass-sip).
# Sostituisci alarm_control_panel.casa, il numero e l'entità media_player.
# Il numero va scritto come lo digiteresti da un interno (es. 3331234567).
# L'entità reale si trova in Strumenti per sviluppatori -> Stati ("media_player.sip_...").
automation:
  - alias: Chiama se scatta l'allarme
    triggers:
      - trigger: state
        entity_id: alarm_control_panel.casa
        to: triggered
    actions:
      - action: sip.dial
        data:
          number: "3331234567"
          message: Attenzione, sta suonando l'allarme di casa
          tts_engine: tts.google_translate
        target:
          entity_id: media_player.IL_TUO_ID
