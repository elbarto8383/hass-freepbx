; Da accodare in fondo a /etc/asterisk/extensions_custom.conf, poi: fwconsole reload
; Richiede una registrazione chiamata "allarme-casa" caricata in
; Admin -> System Recordings.
[chiamata-allarme]
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/allarme-casa)
 same => n,Wait(1)
 same => n,Playback(custom/allarme-casa)
 same => n,Hangup()
